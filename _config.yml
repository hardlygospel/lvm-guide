title: LVM Guide
description: Logical Volume Manager explained clearly — concepts, setup, resizing, snapshots, and a full cheat sheet.
remote_theme: just-the-docs/just-the-docs

color_scheme: dark
search_enabled: true
permalink: pretty

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "LVM Guide &mdash; <a href='https://hardlygospel.github.io'>hardlygospel.github.io</a>"

aux_links:
  "← Homepage":
    - "https://hardlygospel.github.io"
  "GitHub":
    - "https://github.com/hardlygospel/lvm-guide"

aux_links_new_tab: true

callouts_level: quiet
callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
